site_name: GDS-MyVNPT Wiki
site_description: Onboarding and Knowledge Base for GDS-MyVNPT
theme:
  name: material
  features:
    - navigation.path
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - search.share
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
extra_css:
  - stylesheets/custom_v2.css
plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

nav:
  - 📖 Home: index.md
  - 🚀 Bắt đầu:
    - Nguyên lý làm việc: getting-started.md
    - Checklist tuần đầu: bat-dau/checklist.md
    - Công cụ: bat-dau/cong-cu.md
  - 👥 Teams:
    - Jira Tracking Team: teams/jira-tracking.md
    - McKinsey Research Team: teams/mckinsey-research.md
    - PG Insights Team: teams/pg-insights.md
    - UIUX Audit Team: teams/uiux-audit.md
    - UX Design Team: teams/ux-design.md
  - 🧠 Knowledge base:
    - Trang chủ KB: 'knowledge base/index.md'
    - Tổng Hợp: 'knowledge base/tonghop.md'
    - 🗂 Background:
      - 'Các Kết Luận': 'knowledge base/background/Các kết luận.md'
      - 'Hiện Trạng Của Vnpt': 'knowledge base/background/Hiện trạng của VNPT.md'
      - 'Phân Tích Về Các Nhà Mạng Trong Nước': 'knowledge base/background/Phân tích về các nhà mạng trong nước.md'
      - 'Phân Tích Về Môi Trường Kinh Doanh Và Nội Tại Vnpt': 'knowledge base/background/Phân tích về môi trường kinh doanh và nội tại VNPT.md'
      - 'Phân Tích Xu Hướng Ngành Và Các Casestudy Của Các Nhà Mạng Trên Thế Giới': 'knowledge base/background/Phân tích xu hướng ngành và các casestudy của các nhà mạng trên thế giới.md'
    - 📊 Research:
